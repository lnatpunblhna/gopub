name: CI

# 日常校验:推分支和提 PR 都跑,tag 的打包发布交给 release.yml
on:
  push:
    branches: ['**']
  pull_request:

# 只读仓库内容即可
permissions:
  contents: read

# 同一分支上新的推送会取消还在跑的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ./control build 会先跑 gofmt -w src/,这里只检查不改动,有未格式化文件就失败
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l src/)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未经 gofmt 格式化,请在本地执行 gofmt -w src/ :"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # routers 包里的鉴权测试是重点:新增路由若忘了挂 RequireLogin 会在这里失败
      - name: Test
        run: go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # 产物落到 src/views、src/static,CI 只验证能构建通过,不保留产物
      - name: Build
        working-directory: frontend
        run: npm run build
